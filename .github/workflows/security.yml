# Outbound data leaves only through src/services/send.ts and src/providers/messaging/*.
name: security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Snyk Open Source
        run: npx --yes snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Snyk Code
        run: npx --yes snyk code test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
